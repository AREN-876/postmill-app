# Temporary isolated smoke test for MAX-02 only.
# No registry push, no production tokens, no VPS or live MAX connections.
name: MAX-02 Docker Smoke

on:
  push:
    branches:
      - ci/max-02-docker-smoke

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postmill_ci
          POSTGRES_PASSWORD: postmill_ci_only
          POSTGRES_DB: max02_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postmill_ci -d max02_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7

      - name: Verify MAX-02 source commit
        run: |
          git merge-base --is-ancestor ee38aa284baa53bb8454dbcd3d54bd6d994cb42e HEAD
          git show --no-patch --format='%H %s' HEAD

      - name: Build the actual root production Dockerfile
        run: |
          docker build --pull --platform linux/amd64 -f Dockerfile \
            --build-arg NEXT_PUBLIC_VERSION=ci-max02-docker-smoke \
            -t max02-ci-smoke:local .
          docker image inspect max02-ci-smoke:local --format 'image={{.Id}} user={{.Config.User}} health={{json .Config.Healthcheck}}'

      - name: Assert packaged runtime files and non-root image
        run: |
          docker run --rm --entrypoint bash max02-ci-smoke:local -euc '
            test -f /app/docker/entrypoint.sh
            test -f /app/apps/backend/dist/apps/backend/src/main.js
            test -x /app/node_modules/.bin/next
            test -x /app/node_modules/.bin/prisma
            test -f /app/apps/frontend/.next/BUILD_ID
            echo "Runtime files: OK"
          '
          user=$(docker image inspect max02-ci-smoke:local --format '{{.Config.User}}')
          test "$user" = app

      - name: Apply migrations from built image to disposable PostgreSQL
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://postmill_ci:postmill_ci_only@127.0.0.1:5432/max02_ci \
            --entrypoint /app/node_modules/.bin/prisma \
            max02-ci-smoke:local migrate deploy \
            --schema /app/libraries/nestjs-libraries/src/database/prisma/schema.prisma

      - name: Start all-in-one container and smoke-test nginx backend frontend
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/max02-uploads"
          chmod 777 "$RUNNER_TEMP/max02-uploads"
          docker run -d --name max02-ci-app --network host \
            -v "$RUNNER_TEMP/max02-uploads:/uploads" \
            -e DATABASE_URL=postgresql://postmill_ci:postmill_ci_only@127.0.0.1:5432/max02_ci \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e JWT_SECRET=ci-max02-only-no-production-secret \
            -e FRONTEND_URL=http://127.0.0.1:5000 \
            -e MAIN_URL=http://127.0.0.1:5000 \
            -e NEXT_PUBLIC_BACKEND_URL=http://127.0.0.1:5000/api \
            -e BACKEND_INTERNAL_URL=http://127.0.0.1:3000 \
            -e IS_GENERAL=true \
            -e DISABLE_REGISTRATION=true \
            -e INNGEST_DEV=1 \
            -e USE_INNGEST=false \
            max02-ci-smoke:local
          health=000
          for i in $(seq 1 90); do
            status=$(docker inspect -f '{{.State.Status}}' max02-ci-app)
            if [ "$status" != running ]; then
              echo "::error::all-in-one container exited during startup"
              docker logs --tail 150 max02-ci-app
              exit 1
            fi
            health=$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/health/live || true)
            if [ "$health" = 200 ]; then
              break
            fi
            sleep 2
          done
          echo "Backend/nginx health HTTP $health"
          if [ "$health" != 200 ]; then
            docker logs --tail 150 max02-ci-app
            exit 1
          fi
          front=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/ || true)
          echo "Frontend HTTP $front"
          case "$front" in
            200|301|302|303|307|308|401|403) ;;
            *) echo "::error::frontend unavailable"; docker logs --tail 150 max02-ci-app; exit 1 ;;
          esac
          auth=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/user/self || true)
          echo "Unauthenticated API HTTP $auth"
          test "$auth" = 401
          echo "PASS: built image, disposable migrations, nginx, backend, frontend, auth boundary"

      - name: Failure diagnostics and cleanup
        if: always()
        run: |
          docker ps -a --no-trunc || true
          docker logs --tail 100 max02-ci-app 2>&1 || true
          docker rm -f max02-ci-app >/dev/null 2>&1 || true
