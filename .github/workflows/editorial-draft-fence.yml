name: Editorial managed draft fence
on:
  pull_request:
    paths:
      - 'libraries/nestjs-libraries/src/database/prisma/**'
      - 'tools/db/editorial-fence-*.sql'
      - '.github/workflows/editorial-draft-fence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Apply and exercise actual migration on disposable PostgreSQL 17
        shell: bash
        run: |
          set -Eeuo pipefail
          C="postmill-editorial-fence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$C" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$C" --network none -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          for i in $(seq 1 60); do
            if docker exec "$C" pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          docker exec "$C" pg_isready -h 127.0.0.1 -U postgres
          {
            cat tools/db/editorial-fence-fixture.sql
            cat libraries/nestjs-libraries/src/database/prisma/migrations/20261119120000_editorial_draft_fence/migration.sql
            cat tools/db/editorial-fence-assertions.sql
            cat tools/db/editorial-fence-ingress-digest.sql
            cat tools/db/editorial-fence-receipt-fixture.sql
            cat libraries/nestjs-libraries/src/database/prisma/migrations/20261119130000_editorial_draft_receipt/migration.sql
            cat tools/db/editorial-fence-receipt-assertions.sql
            cat tools/db/editorial-fence-target-fixture.sql
            cat libraries/nestjs-libraries/src/database/prisma/migrations/20261119140000_editorial_exchange_target/migration.sql
            cat tools/db/editorial-fence-target-assertions.sql
            cat libraries/nestjs-libraries/src/database/prisma/migrations/20261119150000_editorial_decision_outbox/migration.sql
            cat tools/db/editorial-fence-decision-assertions.sql
          } | docker exec -i "$C" psql -X -U postgres -v ON_ERROR_STOP=1
          # Two independent sessions, one org/task; second call waits for
          # the first transaction, then must return the same historical receipt.
          REQ="jsonb_build_object('schema_version',1,'task_id','101','scope',jsonb_build_object('org_id','org-a','integration_id','max-a','campaign_id','campaign-a','channel_id','42','profile_ref','life-stories@v5','is_test',true,'image_mode','disabled'),'text',jsonb_build_object('revision',1,'sha256',encode(sha256(convert_to(jsonb_build_object('title','Title','parts',jsonb_build_array('One','Two','Three'))::text,'UTF8')),'hex')),'content',jsonb_build_object('title','Title','parts',jsonb_build_array('One','Two','Three')),'firstPart',E'Title\n\nOne','continuationText',E'Two\n────────────────────────\nThree')"
          Q="SELECT postmill_create_editorial_draft_v1($REQ);"
          printf 'BEGIN;\n%s\nSELECT pg_sleep(2);\nCOMMIT;\n' "$Q" | docker exec -i "$C" psql -XAtq -U postgres -v ON_ERROR_STOP=1 > /tmp/edx-first.json &
          FIRST=$!
          docker exec "$C" psql -XAtq -U postgres -v ON_ERROR_STOP=1 -c "$Q" > /tmp/edx-second.json &
          SECOND=$!
          wait "$FIRST"
          wait "$SECOND"
          python3 - <<'PY'
          import json
          from pathlib import Path
          a, b = [json.loads(next(s for s in Path(p).read_text().splitlines() if s.startswith("{"))) for p in ["/tmp/edx-first.json", "/tmp/edx-second.json"]]
          assert sorted([a["created"], b["created"]]) == [False, True]
          assert a["receipt"] == b["receipt"]
          PY
          test "$(docker exec "$C" psql -XAtq -U postgres -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM \"Post\" p JOIN \"EditorialDraftReceipt\" r ON r.\"postId\"=p.id WHERE p.\"organizationId\"='org-a' AND p.\"editorialTaskId\"='101'")" = 1
          echo POSTMILL_EDITORIAL_DRAFT_CONCURRENCY_OK
          # Independent sessions contend on the same review and retry key.
          Q="SELECT postmill_queue_editorial_decision_v1(r.request->'scope','190','test-channel','actor-a',jsonb_build_object('command_id','11111111-1111-4111-8111-111111111111','expected_seq',a.snapshot->'seq','action','approve_text','text',a.snapshot->'text','image',a.snapshot->'image','feedback','')) FROM \"EditorialReviewAnchor\" a JOIN \"EditorialDraftReceipt\" r ON r.\"postId\"=a.\"postId\" JOIN \"Post\" p ON p.id=a.\"postId\" WHERE p.\"editorialTaskId\"='190';"
          printf 'BEGIN;\n%s\nSELECT pg_sleep(2);\nCOMMIT;\n' "$Q" | docker exec -i "$C" psql -XAtq -U postgres -v ON_ERROR_STOP=1 > /tmp/edx-decision-first.json &
          FIRST=$!
          docker exec "$C" psql -XAtq -U postgres -v ON_ERROR_STOP=1 -c "$Q" > /tmp/edx-decision-second.json &
          SECOND=$!
          wait "$FIRST"
          wait "$SECOND"
          python3 - <<'PY'
          import json
          from pathlib import Path
          a, b = [json.loads(next(s for s in Path(p).read_text().splitlines() if s.startswith("{"))) for p in ["/tmp/edx-decision-first.json", "/tmp/edx-decision-second.json"]]
          assert sorted([a["newly_queued"], b["newly_queued"]]) == [False, True]
          assert a["event"] == b["event"]
          assert a["payload_sha256"] == b["payload_sha256"]
          assert a["remote_status"] == b["remote_status"] == "unconfirmed"
          assert not a["dispatch_authorized"] and not b["publishable"]
          PY
          test "$(docker exec "$C" psql -XAtq -U postgres -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM \"EditorialDecisionOutbox\" o JOIN \"Post\" p ON p.id=o.\"postId\" WHERE p.\"editorialTaskId\"='190'")" = 1
          echo POSTMILL_EDITORIAL_DECISION_CONCURRENCY_OK
